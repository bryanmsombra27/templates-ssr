<section class="flex relative">
    <div class="absolute md:relative md:h-auto bg-white  w-full h-full  bottom-0   md:w-3/12 p-4  shadow-xl "
        [ngClass]="{'hidden':isActiveMenu() }">
        <div class="flex items-center gap-2 justify-between">
            <h1 class="text-4xl font-bold">Shadow Orders</h1>
            <div class="block md:hidden">
                <i class="fa-solid fa-bars text-2xl " (click)="toggleMenu()"></i>

            </div>
        </div>
        <hr class="my-5 text-gray-200">

        <div class="flex p-4 gap-4 my-2">
            <i class="fa-solid fa-home text-2xl"></i>
            <a href="#" class="text-xl">Inicio</a>
        </div>
        <div class="flex p-4 gap-4 my-2">
            <i class="fa-solid fa-wrench text-2xl"></i>
            <a href="#" class="text-xl">Ordenes de trabajo</a>
        </div>
        <div class="flex p-4 gap-4 my-2">
            <i class="fa-solid fa-chart-line text-2xl"></i>
            <a href="#" class="text-xl">Ventas</a>
        </div>
        <div class="flex p-4 gap-4 my-2">
            <i class="fa-solid fa-pen-to-square text-2xl"></i>
            <a href="#" class="text-xl">Inventario</a>
        </div>
        <div class="flex p-4 gap-4 my-2">
            <i class="fa-solid fa-cart-shopping text-2xl"></i>
            <a href="#" class="text-xl">Gastos | Compras</a>
        </div>
        <div class="flex p-4 gap-4 my-2">
            <i class="fa-solid fa-suitcase text-2xl"></i>
            <a href="#" class="text-xl">Mantenimientos</a>
        </div>
        <div class="flex p-4 gap-4 my-2">
            <i class="fa-solid fa-print text-2xl"></i>
            <a href="#" class="text-xl">Reportes</a>
        </div>
        <div class="flex p-4 gap-4 my-2">
            <i class="fa-solid fa-gear text-2xl"></i>
            <a href="#" class="text-xl">Configuración</a>
        </div>
        <div class="flex p-4 gap-4 my-2">
            <i class="fa-solid  fa-right-from-bracket text-2xl"></i>
            <a href="#" class="text-xl">Salir</a>
        </div>

    </div>
    <div class="w-full  md:w-8/12   " [ngClass]="{'w-12/12 mx-auto':isActiveMenu()}">
        <div class="w-full flex p-6  justify-between flex-col md:flex-row md:p-8">
            <nav class="flex gap-10 flex-col mb-5 md:mb-0 md:flex-row">
                <div>
                    <i class="fa-solid fa-bars text-2xl" (click)="toggleMenu()"></i>
                    <a href="#" class="text-xl ml-2">Menú</a>
                </div>
                <div>
                    <i class="fa-solid fa-home text-2xl"></i>
                    <a href="#" class="text-xl ml-2">Inicio</a>
                </div>
            </nav>

            <div class="flex   justify-end gap-8  items-center h-0 my-10  md:mt-4 md:flex-row">
                <p class="font-bold">
                    <span>Activo hasta </span>
                    <span class="text-blue-500">01/05/2026 (358 días restantes) </span>
                </p>
                <i class="fa-solid fa-calculator"></i>
                <i class="fa-solid fa-magnifying-glass"></i>
                <i class="fa-solid fa-power-off text-4xl"></i>
            </div>


        </div>


        <div class="md:ml-10 container md:mx-5">
            <app-info-cards />

            <app-orders-status />

        </div>

    </div>





</section>
